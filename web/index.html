<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ATLAS</title>

    <style>
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      
      ::-webkit-scrollbar-track {
        background: #333;
      }
      
      ::-webkit-scrollbar-thumb {
        background: #555;
      }

      * {
        user-select: none;
        -webkit-user-drag: none;
        color: #fff;
        font-family: monospace;
        outline: none;
      }

      body {
        background-color: #000;
        overflow: hidden;
        margin: 0;
      }

      #spawn-buttons {
        background: #111;
        overflow-x: auto;
        white-space: nowrap;
        width: 100%;
        position: absolute;
        bottom: 0;
        left: 0;
      }
      
      #spawn-buttons button {
        background: #111;
        font-size: 20px;
        padding: 10px 20px;
        border: none;
        height: 100px;
        display: inline-block;
      }

      #spawn-buttons button:hover {
        background: #222;
      }

      #spawn-buttons button img {
        margin: auto;
        height: 50%;
        display: block;
      }

      #status-text {
        font-size: 30px;
        margin: 20px;
        position: absolute;
        top: 0;
        left: 0;
      }

      #coords {
        background: #111;
        font-size: 20px;
        padding: 20px;
        position: absolute;
        top: 0;
        right: 0;
      }

      #coords input {
        color: #000;
        font-size: 20px;
        margin: 5px 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="spawn-buttons"></div>
    <div id="status-text"></div>
    <div id="coords">
      X:
      <input type="number" id="x-coord">
      Y:
      <input type="number" id="y-coord">
    </div>

    <noscript>This page contains webassembly and javascript content, please enable javascript in your browser.</noscript>
    <script src="./bootstrap.js"></script>
  </body>
</html>
